<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elroi Medium Clinic – Laboratory Request Form</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --primary: #1a5f7a;
      --primary-dark: #0d3d4f;
      --accent: #c62828;
      --bg: #f5f7fa;
      --white: #ffffff;
      --muted: #555;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
      font-family: "Segoe UI", Arial, "Noto Sans Ethiopic", "Nyala", sans-serif;
      background: #e8e8e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }

    .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 148mm;
    margin: 0 auto 14px auto;
    gap: 12px;
  }
  .site-select-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .site-select-wrap label {
    font-size: 13px;
    font-weight: bold;
    color: #333;
  }
  .site-select {
    padding: 8px 12px;
    font-size: 13px;
    border: 1px solid #999;
    border-radius: 5px;
    background: white;
    min-width: 180px;
    cursor: pointer;
  }
  .print-btn {
    background: #1a5f9e;
    color: white;
    border: none;
    padding: 11px 28px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .print-btn:hover {
    background: #144a7a;
  }

    .form-wrapper {
      max-width: 820px;
      margin: 0 auto;
      background: var(--white);
      border-radius: 10px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.09);
      overflow: hidden;
    }

    #print-area {
      padding: 20px 24px 18px;
      background: #fff;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary);
    }
    .logo { width: 96px; height: 96px; object-fit: contain; flex-shrink: 0; }
    .header-text { flex: 1; text-align: center; }
    .clinic-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .form-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-top: 2px;
    }
    .tel { font-size: 0.88rem; color: var(--muted); margin-top: 2px; }

    .patient-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 9px;
      flex-wrap: nowrap;
    }
    .patient-row .field {
      display: flex;
      align-items: baseline;
      gap: 5px;
      min-width: 0;
    }
    .patient-row .field label {
      font-weight: 600;
      white-space: nowrap;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .patient-row .field input {
      border: none;
      border-bottom: 1.3px solid #777;
      background: transparent;
      padding: 2px 3px;
      font-size: 0.9rem;
      min-width: 0;
      overflow: visible;
    }
    .patient-row .field input:focus {
      outline: none;
      border-bottom-color: var(--primary);
    }

    .field-name { flex: 2.5 1 0; min-width: 0; }
    .field-name input { width: 100%; min-width: 0; }
    .field-age  { flex: 0.6 0 auto; max-width: 70px; }
    .field-age input { width: 100%; }
    .field-sex  { flex: 0.6 0 auto; max-width: 70px; }
    .field-sex input { width: 100%; }
    .field-date { flex: 0 0 auto; }
    .field-phone { flex: 1.2 1 0; min-width: 110px; }
    .field-phone input { width: 100%; min-width: 0; }
    .field-req { flex: 1.4 1 0; min-width: 120px; }
    .field-req input { width: 100%; min-width: 0; }

    .datetime-inline {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
      flex-wrap: nowrap;
    }
    #ethDate {
      border: none;
      border-bottom: 1.3px solid #777;
      background: transparent;
      padding: 2px 3px;
      font-size: 0.9rem;
      width: 92px;
      flex-shrink: 0;
    }
    #ethDate:focus { outline: none; border-bottom-color: var(--primary); }
    #liveTime {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--primary-dark);
      font-size: 0.88rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 28px;
      margin-top: 10px;
    }
    .section { margin-bottom: 12px; }
    .section-title {
      font-size: 0.92rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--primary-dark);
      border-bottom: 1.4px solid #aaa;
      padding-bottom: 3px;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .test-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 7px;
      font-size: 0.88rem;
      flex-wrap: nowrap;
    }
    .test-row label {
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 0;
    }
    .test-row input[type="text"] {
      width: 140px;
      flex: 0 0 140px;
      border: none;
      border-bottom: 1.2px solid #888;
      background: transparent;
      padding: 2px 2px;
      font-size: 0.86rem;
    }
    .test-row input[type="text"]:focus {
      outline: none;
      border-bottom-color: var(--primary);
    }
    .test-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }
    .indent { padding-left: 18px; }
    .sub-label {
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 4px;
      margin-top: 2px;
    }

    .footer {
      margin-top: 18px;
      padding-top: 10px;
      border-top: 1.4px solid #ccc;
      display: flex;
      justify-content: flex-end;
    }
    .footer .field {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 260px;
    }
    .footer .field label { font-weight: 600; white-space: nowrap; font-size: 0.9rem; }
    .footer .field input {
      flex: 1;
      border: none;
      border-bottom: 1.3px solid #777;
      background: transparent;
      padding: 2px 3px;
      font-size: 0.9rem;
    }
    .footer .field input:focus {
      outline: none;
      border-bottom-color: var(--primary);
    }

    
    @media print {
      html, body {
        background: #fff !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        height: 100% !important;
      }
      .top-bar { display: none !important; }

      .form-wrapper {
        box-shadow: none !important;
        border-radius: 0 !important;
        max-width: none !important;
        width: 100% !important;
        min-height: 100% !important;
        height: 100% !important;
      }

      #print-area {
        
        width: 100% !important;
        min-height: 100% !important;
        padding: 4% 4% 3% !important;
        display: flex !important;
        flex-direction: column !important;
        box-sizing: border-box !important;
      }

      
      .header {
        margin-bottom: 0.6em !important;
        padding-bottom: 0.4em !important;
        gap: 0.6em !important;
        flex-shrink: 0 !important;
      }
      .logo {
        width: 4.2em !important;
        height: 4.2em !important;
      }
      .clinic-name { font-size: 1.35em !important; }
      .form-title { font-size: 1.05em !important; }
      .tel { font-size: 0.85em !important; }

      
      .patient-row {
        display: flex !important;
        flex-wrap: nowrap !important;
        gap: 0.75em !important;
        margin-bottom: 0.45em !important;
        flex-shrink: 0 !important;
      }
      .field-date { flex: 0 0 auto !important; }
      .field-phone { flex: 1.2 1 0 !important; min-width: 6em !important; }
      .field-req { flex: 1.4 1 0 !important; min-width: 6.5em !important; }
      .patient-row .field label,
      .patient-row .field input,
      #ethDate, #liveTime {
        font-size: 0.9em !important;
      }
      .datetime-inline {
        display: inline-flex !important;
        flex-wrap: nowrap !important;
        white-space: nowrap !important;
      }
      #ethDate { width: 5.8em !important; }
      .field-phone input, .field-req input {
        width: 100% !important;
        min-width: 0 !important;
        overflow: visible !important;
      }

      
      .sections {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 0.4em 1.2em !important;
        flex: 1 1 auto !important;
        align-content: start !important;
        margin-top: 0.5em !important;
      }
      .section { margin-bottom: 0.7em !important; }
      .section-title {
        font-size: 0.92em !important;
        margin-bottom: 0.4em !important;
        padding-bottom: 0.15em !important;
      }
      .test-row {
        margin-bottom: 0.4em !important;
        font-size: 0.88em !important;
        flex-wrap: nowrap !important;
        gap: 0.35em !important;
      }
      .test-row input[type="text"] {
        
        width: 45% !important;
        flex: 0 0 45% !important;
        max-width: 9em !important;
        font-size: 0.88em !important;
      }
      .test-row input[type="checkbox"] {
        width: 0.9em !important;
        height: 0.9em !important;
      }
      .sub-label { font-size: 0.88em !important; margin-bottom: 0.2em !important; }
      .indent { padding-left: 1em !important; }

      
      .footer {
        margin-top: auto !important;
        padding-top: 0.6em !important;
        flex-shrink: 0 !important;
      }
      .footer .field label,
      .footer .field input { font-size: 0.9em !important; }

      input { border-bottom-color: #000 !important; }

      
      #print-area { page-break-inside: avoid; }
    }

    
    @page {
      margin: 5mm;
    }

    .preview-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 10px;
      overflow-y: auto;
    }
    .preview-overlay.active { display: flex; }
    .preview-box {
      background: #fff;
      border-radius: 10px;
      max-width: 840px;
      width: 100%;
      box-shadow: 0 10px 32px rgba(0,0,0,0.25);
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
      border-radius: 10px 10px 0 0;
    }
    .preview-header h3 { font-size: 1rem; color: var(--primary-dark); }
    .preview-close {
      background: #e0e0e0;
      color: #333;
      padding: 5px 12px;
      font-size: 0.85rem;
    }
    .preview-content { padding: 6px; }

    @media screen and (max-width: 640px) {
      .patient-row { flex-wrap: wrap; }
      .sections { grid-template-columns: 1fr; }
      .toolbar { justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
  <div class="site-select-wrap">
    <select id="siteSelect" class="site-select" onchange="window.location.href=this.value;">
      <option value="lab.html">Lab Report</option>
      <option value="medical.html">Medical Certificate</option>
      <option value="Referral.html">Referral Form</option>
      <option value="CASH INVOICE.html">ATTACHMENT CASH INVOICE</option>
    </select>
  </div>
  <button type="button" class="print-btn " onclick="printForm()">🖨 Print</button>
</div>

   

  <div class="form-wrapper">
    <div id="print-area">
      <div class="header">
        <img  src="logo.jpg" alt="Elroi Medium Clinic Logo" class="logo">
        <div class="header-text">
          <div class="clinic-name">ELROI MEDIUM CLINIC</div>
          <div class="form-title">LABORATORY REQUEST FORM</div>
          <div class="tel">Tel: 0946555575</div>
        </div>
      </div>

      <div class="patient-row">
        <div class="field field-name">
          <label>Name</label>
          <input type="text" id="patientName" placeholder="Patient full name">
        </div>
        <div class="field field-age">
          <label>Age</label>
          <input type="text" id="patientAge">
        </div>
        <div class="field field-sex">
          <label>Sex</label>
          <input type="text" id="patientSex" placeholder="M / F">
        </div>
      </div>

      <div class="patient-row">
        <div class="field field-date">
          <label>Date</label>
          <span class="datetime-inline">
            <input type="text" id="ethDate" readonly title="Ethiopian calendar date">
            <span id="liveTime">12:00:00 PM</span>
          </span>
        </div>
        
        <div class="field field-phone">
          <label>P.No</label>
          <input type="text" id="patientPhone">
        </div>
        
      </div>

      <div class="sections">
        <div>
          <div class="section">
            <div class="section-title">Hematology</div>
            <div class="test-row">
              <input type="checkbox" id="cbc">
              <label for="cbc">CBC</label>
              <input type="text" id="cbcNote">
            </div>
            <div class="test-row">
              <input type="checkbox" id="wbc">
              <label for="wbc">WBC (Leukocytes)</label>
              <input type="text" id="wbcNote">
            </div>
            <div class="test-row"><label>Differentials</label></div>
            <div class="test-row indent">
              <input type="checkbox" id="unsegNeutro">
              <label for="unsegNeutro">Unseg Neutro</label>
              <input type="text" id="unsegNeutroNote">
            </div>
            <div class="test-row">
              <input type="checkbox" id="bf">
              <label for="bf">BF (Haemoparasites)</label>
              <input type="text" id="bfNote">
            </div>
            <div class="test-row">
              <input type="checkbox" id="bloodGroup">
              <label for="bloodGroup">Blood Group &amp; Rh</label>
              <input type="text" id="bloodGroupNote">
            </div>
          </div>

          <div class="section">
            <div class="section-title">Clinical Chemistry</div>
            <div class="sub-label">Glucose:</div>
            <div class="test-row indent">
              <input type="checkbox" id="rbs">
              <label for="rbs">RBS</label>
              <input type="text" id="rbsNote">
            </div>
            <div class="test-row indent">
              <input type="checkbox" id="fbs">
              <label for="fbs">FBS</label>
              <input type="text" id="fbsNote">
            </div>
          </div>
        </div>

        <div>
          <div class="section">
            <div class="section-title">Serology</div>
            <div class="test-row">
              <input type="checkbox" id="widal">
              <label for="widal">Widal test</label>
              <input type="text" id="widalNote">
            </div>
            <div class="test-row">
              <input type="checkbox" id="weilFelix">
              <label for="weilFelix">Weil Felix OX19</label>
              <input type="text" id="weilFelixNote">
            </div>
            <div class="test-row">
              <input type="checkbox" id="vdrl">
              <label for="vdrl">V.D.R.L</label>
              <input type="text" id="vdrlNote">
            </div>
            <div class="test-row">
              <input type="checkbox" id="rhb">
              <label for="rhb"><Kbd></bd>KHB(HIV)</label>
              <input type="text" id="rhbNote">
            </div>
            <div class="test-row"><label style="font-weight:600;">H.PYLORI Test</label></div>
            <div class="test-row indent">
              <input type="checkbox" id="hpStool">
              <label for="hpStool">Stool</label>
              <input type="text" id="hpStoolNote">
            </div>
            <div class="test-row indent">
              <input type="checkbox" id="hpSerum">
              <label for="hpSerum">Serum</label>
              <input type="text" id="hpSerumNote">
            </div>
          </div>

          <div class="section">
            <div class="section-title">Parasitology</div>
            <div class="test-row">
              <input type="checkbox" id="stoolExam">
              <label for="stoolExam">Stool Examination</label>
              <input type="text" id="stoolExamNote">
            </div>
          </div>

          <div class="section">
            <div class="section-title">Bacteriology</div>
            <div class="test-row">
              <input type="checkbox" id="koh">
              <label for="koh">KOH</label>
              <input type="text" id="kohNote">
            </div>
            <div class="test-row">
              <input type="checkbox" id="afs">
              <label for="afs">Acid Fast Stain (AFS)</label>
              <input type="text" id="afsNote">
            </div>
          </div>

          <div class="section">
            <div class="section-title">Urinalysis</div>
            <div class="test-row">
              <input type="checkbox" id="hcg">
              <label for="hcg">Pregnancy Test (HCG)</label>
              <input type="text" id="hcgNote">
              </div>

              <div class="test-row">
              <input type="checkbox" id="Micro">
              <label for="Micro">Microscopy</label>
              <input type="text" id="Micronote">
              </div>

              <div class="test-row">
              <input type="checkbox" id="Dipi">
              <label for="Dipi">Urin Dipistic</label>
              <input type="text" id="Dipinote">
              </div>


            
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="field">
          <label>Requested By</label>
          <input type="text" id="requestedByBottom">
        </div>
      </div>
    </div>
  </div>

  <div class="preview-overlay" id="previewOverlay">
    <div class="preview-box">
      <div class="preview-header">
        <h3>Print Preview</h3>
        <button type="button" class="preview-close" onclick="closePreview()">Close</button>
      </div>
      <div class="preview-content" id="previewContent"></div>
    </div>
  </div>

  <script>
    function gregorianToEthiopian(gDate) {
      const gy = gDate.getFullYear();
      const gm = gDate.getMonth() + 1;
      const gd = gDate.getDate();
      const a = Math.floor((14 - gm) / 12);
      const y = gy + 4800 - a;
      const m = gm + 12 * a - 3;
      const jdn = gd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
      const r = (jdn - 1723856) % 1461;
      const n = r % 365 + 365 * Math.floor(r / 1460);
      const ey = 4 * Math.floor((jdn - 1723856) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460);
      const em = Math.floor(n / 30) + 1;
      const ed = (n % 30) + 1;
      return String(ed).padStart(2, '0') + '/' + String(em).padStart(2, '0') + '/' + ey;
    }

    function setEthiopianDate() {
      document.getElementById('ethDate').value = gregorianToEthiopian(new Date());
    }

    function updateLiveTime() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      document.getElementById('liveTime').textContent =
        String(h).padStart(2, '0') + ':' + m + ':' + s + ' ' + ampm;
    }

    setEthiopianDate();
    updateLiveTime();
    setInterval(updateLiveTime, 1000);
    setInterval(setEthiopianDate, 60000);

    const reqTop = document.getElementById('requestedByTop');
    const reqBottom = document.getElementById('requestedByBottom');
    reqTop.addEventListener('input', () => { reqBottom.value = reqTop.value; });
    reqBottom.addEventListener('input', () => { reqTop.value = reqBottom.value; });

    function printForm() { window.print(); }

    function getPatientNameForFile() {
      const name = document.getElementById('patientName').value.trim();
      if (!name) return 'Laboratory_Request_Form';
      return name.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, '_');
    }

    function saveAsPDF() {
      const element = document.getElementById('print-area');
      const filename = getPatientNameForFile() + '.pdf';
      const opt = {
        margin: [6, 6, 6, 6],
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      const btn = document.querySelector('.btn-save');
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ Generating…';
      btn.disabled = true;
      html2pdf().set(opt).from(element).save().then(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }).catch(() => {
        alert('Could not generate PDF. Use Print → Save as PDF instead.');
        btn.innerHTML = originalText;
        btn.disabled = false;
      });
    }

    function openPreview() {
      const clone = document.getElementById('print-area').cloneNode(true);
      clone.querySelectorAll('input[type="text"]').forEach(inp => {
        inp.setAttribute('readonly', true);
        inp.style.borderBottom = '1px solid #000';
      });
      clone.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.disabled = true; });
      document.getElementById('previewContent').innerHTML = '';
      document.getElementById('previewContent').appendChild(clone);
      document.getElementById('previewOverlay').classList.add('active');
    }
    function closePreview() {
      document.getElementById('previewOverlay').classList.remove('active');
    }
    document.getElementById('previewOverlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closePreview();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });

    function clearForm() {
      if (!confirm('Clear all fields?')) return;
      document.querySelectorAll('#print-area input[type="text"]').forEach(i => {
        if (i.id !== 'ethDate') i.value = '';
      });
      document.querySelectorAll('#print-area input[type="checkbox"]').forEach(c => c.checked = false);
      document.getElementById('requestedByTop').value = '';
      document.getElementById('requestedByBottom').value = '';
      setEthiopianDate();
    }
  </script>
</body>
</html>
