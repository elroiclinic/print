<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referral Form - Elroi Medium Clinic</title>
<style>
  @page {
    size: A5 portrait;
    margin: 7mm 9mm 7mm 9mm;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12.5px;
    line-height: 1.3;
    color: #000;
    background: #e8e8e8;
    padding: 15px;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width:100mm;
    margin: 0 auto 14px auto;
    gap: 12px;
  }
  .site-select-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .site-select-wrap label {
    font-size: 13px;
    font-weight: bold;
    color: #333;
  }
  .site-select {
    padding: 8px 12px;
    font-size: 13px;
    border: 1px solid #999;
    border-radius: 5px;
    background: white;
    min-width: 180px;
    cursor: pointer;
  }
  .print-btn {
    background: #1a5f9e;
    color: white;
    border: none;
    padding: 11px 28px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .print-btn:hover {
    background: #144a7a;
  }

  .form-page {
    width: 148mm;
    height: 210mm;
    background: white;
    margin: 0 auto;
    padding: 7mm 9mm 6mm 9mm;
    box-shadow: 0 0 12px rgba(0,0,0,0.18);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 50px;
    margin-bottom: 3px;
    margin-left: 5px;
    flex-shrink: 0;
  }
  .logo {
    width: 28mm;
    height: auto;
    flex-shrink: 0;

  }
  .header-text {
    flex: 1;
     
  }
  .clinic-amharic {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 0.3px;
  }
  .clinic-english {
    font-size: 14.5px;
    font-weight: 600;
    
    color: red;
  }
  .clinic-contact {
    font-size: 12px;
    margin-top: 3px;
  }
  .title {
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    text-decoration: underline;
    margin: 5px 0 7px 0;
    flex-shrink: 0;
  }

  .client-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 5px;
    font-size: 12.5px;
    flex-shrink: 0;
  }
  .client-table td {
    border: 1px solid #000;
    padding: 5px 6px;
    vertical-align: middle;
  }
  .client-table .label {
    font-weight: bold;
    white-space: nowrap;
    width: 1%;
  }
  .client-table input {
    border: none;
    outline: none;
    width: 100%;
    font-size: 12.5px;
    font-family: inherit;
    background: transparent;
  }

  .three-col {
    display: flex;
    width: 10%;
    margin-bottom: 7px;
    flex-shrink: 0;
  }
  .three-col > div {
    flex: 1;
    border: 1px solid #000;
    border-right: none;
    padding: 5px 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .three-col > div:last-child {
    border-right: 1px solid #000;
  }
  .three-col .label {
    font-weight: bold;
    white-space: nowrap;
  }
  .three-col input {
    border: none;
    outline: none;
    flex: 1;
    font-size: 12.5px;
    font-family: inherit;
    background: transparent;
    min-width: 0;
  }

  .vitals {
    margin: 4px 0 6px 0;
    font-size: 12.5px;
    flex-shrink: 0;
  }
  .vitals-line {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
    flex-wrap: nowrap;
  }
  .vitals-line label {
    font-weight: bold;
    white-space: nowrap;
  }
  .vitals-line input {
    border: none;
    border-bottom: 1px solid #000;
    outline: none;
    width: 28mm;
    font-size: 12.5px;
    font-family: inherit;
    background: transparent;
    padding: 2px 3px;
  }

  .sections-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .section {
    display: flex;
    flex-direction: column;
    margin-top: 5px;
  }
  .section-label {
    font-weight: bold;
    font-size: 12.5px;
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .lined-area {
    flex: 1;
    min-height: 20px;
    line-height: 19px;
    background-image: repeating-linear-gradient(
      transparent 0,
      transparent 18px,
      #333 18px,
      #333 19px
    );
    background-size: 100% 19px;
    padding: 0 3px;
    outline: none;
    font-size: 12.5px;
    font-family: inherit;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  .cc-area     { flex: 1.1; }
  .exam-area   { flex: 1.5; }
  .dx-area     { flex: 1.1; }
  .reason-area { flex: 1.5; }

  .datetime {
    margin-top: 8px;
    font-size: 13.5px;
    font-weight: bold;
    flex-shrink: 0;
  }

  .signature {
    margin-top: 10px;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .signature .line {
    flex: 1;
    border-bottom: 1px solid #000;
    height: 18px;
  }

  @media print {
    html, body {
      background: white !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 148mm;
      height: 210mm;
    }
    .top-bar {
      display: none !important;
    }
    .form-page {
      width: 148mm !important;
      height: 210mm !important;
      margin: 0 !important;
      padding: 7mm 9mm 6mm 9mm !important;
      box-shadow: none !important;
      page-break-after: avoid;
      overflow: hidden;
    }
    .lined-area {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="site-select-wrap">
    <select id="siteSelect" class="site-select" onchange="window.location.href=this.value;">
      <option value="Referral.html">Referral Form</option>
      <option value="medical.html">Medical Certificate</option>
      <option value="CASH INVOICE.html">ATTACHMENT CASH INVOICE</option>
      <option value="lab.html">Lab Report</option>
      <option value="marriage.html">Marriage certificate</option>
    </select>
  </div>
  <button class="print-btn" onclick="window.print()">🖨️ Print </button>
</div>

<div class="form-page">
  <div class="header">
    <img  style="width: 130px; height: 130px;" src="logo.jpg" alt="Elroi Medium Clinic Logo" class="logo">
    <div class="header-text">
      <div class="clinic-amharic">አልሮኢ መካከለኛ ክሊኒክ</div>
      <div class="clinic-english">Elroi Medium Clinic</div>
      <div class="clinic-contact">Tel: 09 46 55 55 75 &nbsp;Hawassa</div>
    </div>
  </div>

  <div class="title">Referral Form</div>

  <table class="client-table">
    <tr>
      <td class="label" style="width:26mm;">Client Name</td>
      <td><input type="text" id="clientName" spellcheck="false"></td>
    </tr>
  </table>

  <div class="three-col">
    <div>
      <span class="label">Age</span>
      <input type="text" id="age" spellcheck="false">
    </div>
    <div>

      <span class="label">Sex</span>
      <input type="text" id="sex" spellcheck="false">
    </div>
    <div>
      
      <span class="label">Card No</span>
      <input type="text" id="cardNo" spellcheck="false">
    </div>
  </div>

  <div class="vitals">
    <div class="vitals-line">
      <label>B/P</label>
      <input type="text" id="bp" spellcheck="false">
      <label>P/R</label>
      <input type="text" id="pr" spellcheck="false">
      <label>R/R</label>
      <input type="text" id="rr" spellcheck="false">
    </div>
    <div class="vitals-line">
      <label>Temp</label>
      <input type="text" id="temp" spellcheck="false">
      <label>K/g</label>
      <input type="text" id="kg" spellcheck="false">
    </div>
  </div>

  <div class="sections-wrapper">
    <div class="section" style="flex: 1.1;">
      <div class="section-label">C/C</div>
      <div class="lined-area cc-area" contenteditable="true" id="cc"></div>
    </div>

    <div class="section" style="flex: 1.5;">
      <div class="section-label">P/Examination</div>
      <div class="lined-area exam-area" contenteditable="true" id="exam"></div>
    </div>

    <div class="section" style="flex: 1.1;">
      <div class="section-label">Dx</div>
      <div class="lined-area dx-area" contenteditable="true" id="dx"></div>
    </div>

    <div class="section" style="flex: 1.5;">
      <div class="section-label">Reason for Refer</div>
      <div class="lined-area reason-area" contenteditable="true" id="reason"></div>
    </div>
  </div>

  <div class="datetime" id="datetime"></div>

  <div class="signature">
    <span>D’r Sign</span>
    <div class="line"></div>
  </div>
</div>

<script>
  function gregToEth(year, month, day) {
    const jd = (function(y, m, d) {
      const a = Math.floor((14 - m) / 12);
      const yy = y + 4800 - a;
      const mm = m + 12 * a - 3;
      return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
    })(year, month, day);

    const r = jd - 1723856;
    const yearEth = Math.floor((4 * r + 3) / 1461);
    const t = r - Math.floor(1461 * yearEth / 4);
    const monthEth = Math.floor(t / 30) + 1;
    const dayEth = (t % 30) + 1;

    return { year: yearEth, month: monthEth, day: dayEth };
  }

  function formatTime12(date) {
    let hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    return `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
  }

  function updateDateTime() {
    const now = new Date();
    const eth = gregToEth(now.getFullYear(), now.getMonth() + 1, now.getDate());
    
    const day   = String(eth.day).padStart(2, '0');
    const month = String(eth.month).padStart(2, '0');
    const year  = eth.year;
    
    document.getElementById('datetime').textContent = 
      `${day}/${month}/${year}  ${formatTime12(now)}`;
  }

  updateDateTime();
  setInterval(updateDateTime, 1000);
</script>
</body>
</html>
